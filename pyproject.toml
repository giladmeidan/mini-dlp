[project]
name = "mini-dlp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "httpx2", "ruff", "python-dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Docs are not code: never let `ruff format` rewrite snippets in Markdown files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]
